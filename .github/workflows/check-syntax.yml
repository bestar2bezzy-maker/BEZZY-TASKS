
name: Vérification syntaxe et tests JavaScript

on:
  push:
    branches:
      - migration/neon-postgres
  pull_request:
    branches:
      - migration/neon-postgres
  workflow_dispatch:

permissions:
  contents: read

jobs:
  syntax-check:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci --ignore-scripts

      - name: Vérifier la syntaxe JavaScript
        run: npm run check

      - name: Exécuter les tests
        run: npm test
        
